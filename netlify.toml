# The build settings live in the repo so the Node version moves with the code.
# Vite 7 needs Node 20.19+ or 22.12+; Netlify's default is older than that for
# sites created before this was added, which fails the build at install time.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
